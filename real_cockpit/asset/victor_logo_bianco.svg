<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <title>Victor - Versione Luce</title>
  <defs>
    <!-- Petalo a mezzaluna TrinAI puro: corda 160, sagitta 40, arco R=100 -->
    <path id="petalo" d="M -80 0 L 80 0 A 100 100 0 0 0 -80 0 Z"/>
  </defs>
  <g id="trinai-luce" fill="#F4EFE6">
    <use href="#petalo" transform="rotate(0 512 512) translate(720 938)"/>
    <use href="#petalo" transform="rotate(45 512 512) translate(720 938)"/>
    <use href="#petalo" transform="rotate(90 512 512) translate(720 938)"/>
    <use href="#petalo" transform="rotate(135 512 512) translate(720 938)"/>
    <use href="#petalo" transform="rotate(180 512 512) translate(720 938)"/>
    <use href="#petalo" transform="rotate(225 512 512) translate(720 938)"/>
    <use href="#petalo" transform="rotate(270 512 512) translate(720 938)"/>
    <use href="#petalo" transform="rotate(315 512 512) translate(720 938)"/>
  </g>
  <!-- V dentro il diamante: due petali speculari rialzati e calibrati -->
  <g id="victor-v-petali" fill="#F4EFE6">
    <!-- Asta sinistra della V (corda dritta interna, arco organico esterno) -->
    <use href="#petalo" transform="translate(440.0 506.0) rotate(52.0) scale(1.35)"/>
    <!-- Asta destra della V (speculare rispetto all'asse x=512) -->
    <use href="#petalo" transform="translate(584.0 506.0) rotate(-52.0) scale(-1.35, 1.35)"/>
  </g>
  <!-- Profilo essenziale a tratto del diamante (spessore calibrato 24) -->
  <g id="diamante-profilo" fill="none" stroke="#F4EFE6" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="342.0,310.0 682.0,310.0 782.0,450.0 512,710.0 242.0,450.0"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <title>TrinAI - Marchio Originale</title>
  <defs>
    <!-- Petalo a mezzaluna TrinAI: corda 160, sagitta 40, arco R=100 -->
    <path id="petalo" d="M -80 0 L 80 0 A 100 100 0 0 0 -80 0 Z"/>
  </defs>
  <g fill="#050811">
    <!-- Anello esterno (8 petali a vortice) -->
    <g id="anello-esterno">
      <use href="#petalo" transform="rotate(0 512 512) translate(720 938)"/>
      <use href="#petalo" transform="rotate(45 512 512) translate(720 938)"/>
      <use href="#petalo" transform="rotate(90 512 512) translate(720 938)"/>
      <use href="#petalo" transform="rotate(135 512 512) translate(720 938)"/>
      <use href="#petalo" transform="rotate(180 512 512) translate(720 938)"/>
      <use href="#petalo" transform="rotate(225 512 512) translate(720 938)"/>
      <use href="#petalo" transform="rotate(270 512 512) translate(720 938)"/>
      <use href="#petalo" transform="rotate(315 512 512) translate(720 938)"/>
    </g>
    <!-- Anello interno (8 petali) -->
    <g id="anello-interno">
      <use href="#petalo" transform="rotate(0 512 512) translate(721 671) rotate(31.4)"/>
      <use href="#petalo" transform="rotate(45 512 512) translate(721 671) rotate(31.4)"/>
      <use href="#petalo" transform="rotate(90 512 512) translate(721 671) rotate(31.4)"/>
      <use href="#petalo" transform="rotate(135 512 512) translate(721 671) rotate(31.4)"/>
      <use href="#petalo" transform="rotate(180 512 512) translate(721 671) rotate(31.4)"/>
      <use href="#petalo" transform="rotate(225 512 512) translate(721 671) rotate(31.4)"/>
      <use href="#petalo" transform="rotate(270 512 512) translate(721 671) rotate(31.4)"/>
      <use href="#petalo" transform="rotate(315 512 512) translate(721 671) rotate(31.4)"/>
    </g>
  </g>
</svg>